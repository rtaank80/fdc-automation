name: Weekly Instagram draft

# Every day this makes a draft (up to 3 captions + an image) and emails it to the approver.
# Nothing is posted until the approver clicks Approve in that email; that starts publish.yml.
# The same workflow is started by the approval Worker when the approver asks for new captions/image.

on:
  schedule:
    - cron: "0 10 * * *"   # Every day 10:00 UTC (10:00 UK in winter, 11:00 in summer time)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (placeholder image, no AI calls; the email is marked TEST and cannot post)"
        type: boolean
        default: true
      mode:
        description: "new = fresh draft. The others redo part of an earlier draft (used by the email buttons)"
        type: choice
        options: [new, captions, image, all]
        default: new
      prev_run_id:
        description: "Run ID of the draft being redone (only for captions/image/all)"
        required: false
        default: ""
      regens_used:
        description: "Regenerations already used for this draft"
        required: false
        default: "0"
      theme_id:
        description: "Force a theme id from themes.json (optional)"
        required: false
      refresh_token:
        description: "Also refresh the Instagram token now"
        type: boolean
        default: false

permissions:
  contents: write   # lets the draft stage read the repo; publish.yml uses write to save the post image
  actions: read     # lets a regeneration download the earlier draft

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Make the draft and email the approver
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER || 'cloudflare' }}
          IMAGE_MODEL_A: ${{ vars.IMAGE_MODEL_A }}
          IMAGE_MODEL_B: ${{ vars.IMAGE_MODEL_B }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          THEME_ID: ${{ inputs.theme_id }}
          MODE: ${{ inputs.mode || 'new' }}
          PREV_RUN_ID: ${{ inputs.prev_run_id }}
          REGENS_USED: ${{ inputs.regens_used || '0' }}
          DRY: ${{ inputs.dry_run && '1' || '' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRAFT_RUN_ID: ${{ github.run_id }}
          # Approval email (see README)
          SMTP_HOST: ${{ vars.SMTP_HOST || 'smtp.livemail.co.uk' }}
          SMTP_PORT: ${{ vars.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          APPROVER_EMAIL: ${{ secrets.APPROVER_EMAIL }}
          APPROVAL_BASE_URL: ${{ vars.APPROVAL_BASE_URL }}
          LINK_SECRET: ${{ secrets.LINK_SECRET }}
        run: python post_weekly.py generate ${DRY:+--dry-run}
      # The draft is saved BEFORE any approval link can be used, because publishing reads it back.
      - uses: actions/upload-artifact@v6
        with:
          name: draft
          path: |
            out/draft.json
            out/draft.md
            out/image-a.jpg
            out/image-b.jpg
          retention-days: 7

  refresh-token:
    # Instagram tokens last 60 days; refreshing weekly keeps it alive forever.
    # Needs a GitHub personal access token (secret GH_PAT) that can write repo secrets.
    if: ${{ github.event_name == 'schedule' || inputs.refresh_token }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh Instagram token and store it
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python post_weekly.py refresh --out new_token.txt
          if [ -s new_token.txt ]; then
            if [ -z "$GH_TOKEN" ]; then
              echo "::warning::GH_PAT secret not set; token refreshed but NOT saved. Add GH_PAT (see README)."
            else
              echo "::add-mask::$(cat new_token.txt)"
              gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < new_token.txt
              echo "Saved refreshed token to IG_ACCESS_TOKEN"
            fi
          fi
          rm -f new_token.txt
