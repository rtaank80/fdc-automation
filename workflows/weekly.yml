name: Weekly Instagram post

on:
  schedule:
    - cron: "0 9 * * 2"   # Every Tuesday 09:00 UTC (10:00 UK summer time, 09:00 winter)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (no paid API calls, nothing posted)"
        type: boolean
        default: true
      theme_id:
        description: "Force a theme id from themes.json (optional)"
        required: false

permissions:
  contents: write   # saves the post image into the repo (IMAGE_HOST=github)
  actions: read     # lets the publish step read your caption choice from the approval comment

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Generate draft (caption + image)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IMAGE_PROVIDER: ${{ vars.IMAGE_PROVIDER || 'cloudflare' }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          THEME_ID: ${{ inputs.theme_id }}
        run: python post_weekly.py generate ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Show draft in the run summary
        run: cat out/draft.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        with:
          name: draft
          path: out/

  refresh-token:
    # Instagram tokens last 60 days; refreshing weekly keeps it alive forever.
    # Needs a GitHub personal access token (secret GH_PAT) that can write repo secrets.
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh Instagram token and store it
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          python post_weekly.py refresh --out new_token.txt
          if [ -s new_token.txt ]; then
            if [ -z "$GH_TOKEN" ]; then
              echo "::warning::GH_PAT secret not set; token refreshed but NOT saved. Add GH_PAT (see README)."
            else
              echo "::add-mask::$(cat new_token.txt)"
              gh secret set IG_ACCESS_TOKEN --repo "$GITHUB_REPOSITORY" < new_token.txt
              echo "Saved refreshed token to IG_ACCESS_TOKEN"
            fi
          fi
          rm -f new_token.txt

  publish:
    needs: [generate, refresh-token]
    if: ${{ always() && needs.generate.result == 'success' && (needs.refresh-token.result == 'success' || needs.refresh-token.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Add "Required reviewers" to this environment (Settings > Environments) to approve each post.
    # With no reviewers configured, it posts automatically.
    environment: instagram-approval
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - uses: actions/download-artifact@v7
        with:
          name: draft
          path: out/
      - name: Publish to Instagram
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          IMAGE_HOST: ${{ vars.IMAGE_HOST || 'github' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python post_weekly.py publish ${{ inputs.dry_run && '--dry-run' || '' }}
